<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Predict Simulator</title>
    <meta name="description" content="Explore the Predict Mobile prototype in your browser. Predictions and account flows are simulated.">
    <meta property="og:title" content="Predict Simulator">
    <meta property="og:description" content="A browser-based mirror of the Predict Mobile prototype.">
    <link rel="icon" href="/predict-simulator/app/favicon.ico">
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; }
      body { display: flex; align-items: center; justify-content: center; }
      .frame {
        width: 402px;
        height: min(874px, calc(100vh - 48px));
        border-radius: 40px;
        border: 6px solid #1f1f1f;
        box-shadow: 0 24px 80px rgba(0,0,0,0.6);
        overflow: hidden;
        background: #000;
      }
      iframe { width: 100%; height: 100%; border: 0; display: block; }
      @media (max-width: 500px), (max-height: 500px) {
        .frame { width: 100vw; height: 100vh; border: 0; border-radius: 0; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <main class="frame" aria-label="Predict Simulator">
      <iframe src="/predict-simulator/app/" title="Predict Simulator mobile app" allow="clipboard-write"></iframe>
    </main>
  </body>
</html>
